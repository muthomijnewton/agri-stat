name: AgriStat verification
on:
  push:
    paths: ['backend/**', 'web/**', 'alembic/**', 'infra/**', '.github/workflows/phase1.yml']
  pull_request:
    paths: ['backend/**', 'web/**', 'alembic/**', 'infra/**', '.github/workflows/phase1.yml']
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: agristat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d agristat_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SECRET_KEY: phase1-ci-isolated-not-a-production-key
      PHASE1_POSTGRES_TEST_URL: postgresql+psycopg2://postgres:ci-local-only@localhost:5432/agristat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests/test_foundation.py tests/test_foundation_postgres.py tests/test_farm_sales.py tests/test_farm_sales_postgres.py tests/test_planning.py tests/test_dashboard.py tests/api/test_auth.py tests/api/test_products.py -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
